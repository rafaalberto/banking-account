plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.23.0'
    // optionally: id 'com.github.johnrengelman.shadow' version '8.1.1' // recommended for fat jars
}

checkstyle {
    toolVersion = '10.12.4'
    configFile = file('config/checkstyle/checkstyle.xml')
}

spotless {
    java {
        googleJavaFormat('1.17.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        target 'src/**/*.java'
    }
}

ext {
    undertowVersion = '2.3.20.Final'
    jacksonVersion = '2.17.0'
    h2DatabaseVersion = '2.2.224'
    hikariCPVersion = '5.1.0'
    slf4jVersion = '2.0.13'
    commonsLangVersion = '3.18.0'
    junitJupiterVersion = '5.11.0'
    junitPlatformLauncher = '1.11.0'
    assertVersion = '3.26.0'
    mockitoVersion = '5.11.0'
    restAssuredVersion = '5.5.5'
}

group = 'com.api.account'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "io.undertow:undertow-core:${undertowVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.h2database:h2:${h2DatabaseVersion}"
    implementation "com.zaxxer:HikariCP:${hikariCPVersion}"

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    // For local/dev/testing you can keep slf4j-simple, but prefer a production binding (e.g. logback-classic)
    implementation "org.slf4j:slf4j-simple:${slf4jVersion}" // TODO: consider replacing with logback-classic

    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformLauncher}"
    testImplementation "org.assertj:assertj-core:${assertVersion}"
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
        html.outputLocation = file("$buildDir/reports/checkstyle/checkstyle.html")
    }
    // keep ordering control, but do not declare dependsOn here to avoid redundant wiring
}

tasks.named('checkstyleMain') {
    mustRunAfter 'spotlessCheck'
}

tasks.named('checkstyleTest') {
    mustRunAfter 'spotlessCheck'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events = ["passed", "skipped", "failed"]
        exceptionFormat = "short"
        showStandardStreams = false
    }
}

// Configure unit test task
test {
    useJUnitPlatform()
    exclude "**/integration/**"
    exclude "**/*IntegrationTest.java"
}

// Integration tests as a separate task (consider creating a separate sourceSet if you want isolation)
tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/integration/**"
    include "**/*IntegrationTest.java"
    shouldRunAfter test
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
    dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
    dependsOn 'integrationTest'
}

jar {
    archiveFileName = 'banking-account.jar'
    manifest {
        attributes 'Main-Class': 'com.api.account.BankingAccountApplication'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
