name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Determine build tool and run build/tests
        id: build
        run: |
          set -euo pipefail

          # Detect Gradle (wrapper) or Maven (pom.xml)
          if [ -f "./gradlew" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project."
            BUILD_TOOL="gradle"

            # (optional) cache Gradle (you can add actions/cache for speed if desired)
            echo "##[group]Gradle build started"
            echo "::endgroup::"

            # run build with Gradle wrapper if present, fallback to gradle
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew --version
              # build & test using wrapper
              ./gradlew clean build || ./gradlew build || true
              ./gradlew test
            else
              gradle --version
              gradle clean build
              gradle test
            fi

          elif [ -f "pom.xml" ]; then
            echo "Detected Maven project."
            BUILD_TOOL="maven"

            # run maven build
            mvn -v
            mvn -B -DskipTests=false clean verify

          else
            echo "No Maven or Gradle files found. Exiting with error."
            exit 2
          fi

          # Set output after build completes (or fails)
          if [ -n "${BUILD_TOOL:-}" ]; then
            echo "build_tool=${BUILD_TOOL}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload test results (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/build/reports/tests/**/*.html

      - name: Show short summary
        run: |
          echo "Build job finished. Check test artifacts and logs for details."